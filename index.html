<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="google-site-verification" content="MjTY0z_vy1o8rvymS01fYJCNWIwjMiVXiWajOBHVYaI" />

    <!--
      Primary SEO — fallbacks only, for the initial paint and for crawlers that
      do not execute JavaScript.

      The data-rh="true" attribute matters: react-helmet-async marks the tags it
      owns with data-rh, and on mount it REPLACES owned tags instead of appending
      to them. Without it, every route kept these homepage tags and appended its
      own, so each page shipped two titles and two descriptions and the generic
      homepage pair won. Do not remove data-rh from these tags.

      Only tags that every page re-declares are marked. Tags left unmarked below
      (og:image, twitter:card, etc.) are deliberate site-wide fallbacks.
    -->
    <title data-rh="true">eQOURSE – Content &amp; AI Data Services | India &amp; Singapore</title>
    <meta data-rh="true" name="description" content="eQOURSE: ISO 9001 &amp; 27001 certified Content &amp; AI Data Services. Custom e-learning content, data annotation &amp; model testing. 500+ expert." />
    <link data-rh="true" rel="canonical" href="https://www.eqourse.com/" />
    <meta name="author" content="eQOURSE" />
    <meta data-rh="true" name="keywords" content="eQOURSE, Content Services, AI data services, e-learning content, curriculum development, data annotation, AI training data, model testing, educational technology, India, Singapore" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="eQOURSE" />
    <meta data-rh="true" property="og:title" content="eQOURSE – Content &amp; AI Data Services | India &amp; Singapore" />
    <meta data-rh="true" property="og:description" content="eQOURSE: ISO 9001 &amp; 27001 certified Content &amp; AI Data Services. Custom e-learning content, data annotation &amp; model testing. 500+ expert." />
    <meta data-rh="true" property="og:url" content="https://www.eqourse.com/" />
    <meta property="og:image" content="https://www.eqourse.com/assets/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@EQourse" />
    <meta data-rh="true" name="twitter:title" content="eQOURSE – Content &amp; AI Data Services | India &amp; Singapore" />
    <meta data-rh="true" name="twitter:description" content="eQOURSE: ISO 9001 &amp; 27001 certified Content &amp; AI Data Services. Custom e-learning content, data annotation &amp; model testing. 500+ expert." />
    <meta name="twitter:image" content="https://www.eqourse.com/assets/og-image.png" />

    <!-- Favicon & Icons -->
    <link rel="icon" href="/favicon.ico" type="image/x-icon" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon.ico" />
    <meta name="theme-color" content="#14B8A6" />

    <!-- Robots -->
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />

    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-41GXR67XGE"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-41GXR67XGE');
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
